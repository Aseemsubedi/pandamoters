        }

            max-width: 36ch;
            color: var(--muted);
            font-size: 1.05rem;
        }
        .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px 22px; }
        .links a {
            color: var(--sky-deep);
            text-decoration: none;
            font-weight: 600;
        }

            display: inline-flex;
            align-items: center;
            margin-top: 28px;
            padding: 12px 20px;
            border-radius: 999px;
            background: var(--navy);
            color: #fff;
            text-decoration: none;
